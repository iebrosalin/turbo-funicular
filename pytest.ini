[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --import-mode=importlib -v --tb=short
markers =
    e2e: E2E headless tests via HTTP API + DB (no browser)
    slow: Slow running tests
