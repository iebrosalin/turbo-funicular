version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/workspace/data
      - ./backend/main.py:/workspace/backend/main.py
      - ./backend/core:/workspace/backend/core
      - ./backend/db:/workspace/backend/db
      - ./backend/routes:/workspace/backend/routes
      - ./backend/utils:/workspace/backend/utils
      - ./backend/redcheck_integration:/workspace/backend/redcheck_integration
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///workspace/data/app.db
    restart: unless-stopped

  test:
    build: .
    profiles: ["test"]
    command: echo "Test container ready for headless testing"
    volumes:
      - ./data:/workspace/data
    environment:
      - HEADLESS=true
