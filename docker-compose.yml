version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app/data:/app/data
      - ./app/backend:/app/backend
      - ./app/frontend/src:/app/frontend/src
    environment:
      - FLASK_ENV=development
      - NODE_ENV=development
    restart: unless-stopped

  test:
    build: .
    profiles: ["test"]
    command: echo "Test container ready for headless testing"
    volumes:
      - ./app/data:/app/data
    environment:
      - HEADLESS=true
