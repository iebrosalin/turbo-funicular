services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/workspace/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///workspace/data/app.db
    restart: unless-stopped

  test:
    build: .
    profiles: ["test"]
    command: echo "Test container ready for headless testing"
    volumes:
      - ./data:/workspace/data
    environment:
      - HEADLESS=true
